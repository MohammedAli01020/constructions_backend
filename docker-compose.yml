services:

  mysql-constructions:
    image: mysql:8.0
    container_name: constructions-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: constructions

#    ports:
#      - "3307:3306"

    volumes:
      - constructions_mysql_data:/var/lib/mysql


  constructions-backend:
    build: .
    container_name: constructions-backend
    restart: unless-stopped

    depends_on:
      - mysql-constructions

    ports:
      - "5000:5000"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-constructions:3306/constructions
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      SPRING_MAIL_HOST: "smtp.gmail.com"
      SPRING_MAIL_PORT: "587"
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 50MB

volumes:
  constructions_mysql_data: